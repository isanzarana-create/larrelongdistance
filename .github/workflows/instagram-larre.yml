# ─────────────────────────────────────────────────────────────
# Galería de Instagram · Ultra Trail Larre ®
# Se ejecuta solo, una vez por semana. Las fotos nuevas entran OCULTAS:
# salen en la web cuando alguien les escribe el texto alternativo en es/eu/en.
# ─────────────────────────────────────────────────────────────
name: Galería de Instagram (LARRE)

on:
  schedule:
    # Lunes a las 06:10 UTC (07:10 en Vitoria-Gasteiz en invierno, 08:10 en
    # verano). Media hora antes que Musubigara para no solapar las dos.
    - cron: '10 6 * * 1'
  workflow_dispatch:        # botón para lanzarlo a mano cuando quieras

concurrency:
  group: instagram-larre
  cancel-in-progress: false

permissions:
  contents: write           # para poder publicar las fotos nuevas

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar el conversor de imágenes
        run: npm install --no-save --no-audit --no-fund sharp@0.33.5

      - name: Sincronizar con Instagram
        env:
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
          IG_ACCOUNT: ultratraillarre
          IG_LIMIT:   '24'
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "Sin clave de Instagram: la galería se queda como está."
          else
            node tools/instagram-sync.mjs
          fi

      - name: Guardar la clave renovada por Meta
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "Sin GH_PAT: la clave no se renueva sola. Habrá que regenerarla antes de 60 días."
            exit 0
          fi
          if [ ! -f "$RUNNER_TEMP/ig_token_new.txt" ]; then
            echo "Meta no devolvió clave nueva en esta pasada."
            exit 0
          fi
          GH_TOKEN="$GH_PAT" gh secret set IG_TOKEN \
            --body "$(cat "$RUNNER_TEMP/ig_token_new.txt")" \
            --repo "$GITHUB_REPOSITORY"
          echo "Clave renovada y guardada. Siguiente caducidad: dentro de 60 días."

      - name: Regenerar la web y comprobar que sigue sana
        run: |
          node tools/build.mjs
          node tools/check-seo.mjs --root public

      - name: Comprobar que no se cuela ninguna clave en el repositorio
        run: |
          rm -rf node_modules
          if grep -rIlE 'IG[A-Za-z0-9]{3}[A-Za-z0-9_-]{30,}' . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md'; then
            echo "ALTO: algo con pinta de clave de acceso está dentro del repositorio."
            exit 1
          fi
          echo "Limpio."

      - name: Publicar los cambios
        run: |
          git config user.name  "Robot Ultra Trail Larre"
          git config user.email "robot@ultratraillarre.org"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada que publicar: la galería ya estaba al día."
            exit 0
          fi
          # Mientras las fotos nuevas estén ocultas, en la web no se ve nada
          # distinto: el commit lleva [skip netlify] y no gasta despliegue.
          if git diff --cached --name-only | grep -qvE '^(public/fotos/|tools/data/galeria\.json$)'; then
            MSG="Galería: sincronizada con Instagram"
          else
            MSG="Galería: fotos nuevas en espera de texto alternativo [skip netlify]"
          fi
          git commit -m "$MSG"
          git push
          echo "Publicado: $MSG"
